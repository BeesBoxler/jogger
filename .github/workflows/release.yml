name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: jogger
            build_deps: "libncurses5-dev libncursesw5-dev"
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: jogger-macos
            build_deps: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: jogger-macos
            build_deps: ""
            
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          
      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev ${{ matrix.build_deps }}
          
      - name: Build
        run: |
          cargo install --path ${{ matrix.binary == 'jogger' && 'jogger-tui' || 'jogger-macos' }} --target ${{ matrix.target }} --root . --locked
          
      - name: Create App Bundle (macOS only)
        if: matrix.binary == 'jogger-macos'
        run: |
          APP_NAME="Jogger"
          BUNDLE_DIR="${APP_NAME}.app"
          mkdir -p "${BUNDLE_DIR}/Contents/MacOS"
          mkdir -p "${BUNDLE_DIR}/Contents/Resources"
          mv bin/${{ matrix.binary }} "${BUNDLE_DIR}/Contents/MacOS/${APP_NAME}"
          cat > "${BUNDLE_DIR}/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>${APP_NAME}</string>
              <key>CFBundleIdentifier</key>
              <string>com.jogger.macos</string>
              <key>CFBundleName</key>
              <string>${APP_NAME}</string>
              <key>LSUIElement</key>
              <true/>
          </dict>
          </plist>
          EOF
          
      - name: Package
        run: |
          if [[ "${{ matrix.target }}" == *"apple-darwin"* ]]; then
            if [ "${{ matrix.binary }}" = "jogger-macos" ]; then
              ditto -c -k --sequesterRsrc --keepParent Jogger.app ${{ matrix.binary }}-${{ matrix.target }}.zip
            else
              ditto -c -k --sequesterRsrc --keepParent bin/${{ matrix.binary }} ${{ matrix.binary }}-${{ matrix.target }}.zip
            fi
          else
            tar czf ${{ matrix.binary }}-${{ matrix.target }}.tar.gz -C bin ${{ matrix.binary }}
          fi
          
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.binary }}-${{ matrix.target }}.${{ contains(matrix.target, 'apple-darwin') && 'zip' || 'tar.gz' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew-tap:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: BeesBoxler/homebrew-jogger
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-jogger

      - name: Update cask for this release
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          VERSION="${VERSION#v}"
          OWNER="BeesBoxler"
          REPO="jogger"
          APP="jogger-macos"

          arm_url="https://github.com/${OWNER}/${REPO}/releases/download/v${VERSION}/${APP}-aarch64-apple-darwin.zip"
          intel_url="https://github.com/${OWNER}/${REPO}/releases/download/v${VERSION}/${APP}-x86_64-apple-darwin.zip"

          download_with_retry() {
            local url="$1"
            local output="$2"
            for i in 1 2 3 4 5; do
              if curl -fL "$url" -o "$output"; then
                return 0
              fi
              sleep 5
            done
            echo "Failed to download: $url" >&2
            return 1
          }

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          download_with_retry "$arm_url" "$tmp_dir/arm.zip"
          download_with_retry "$intel_url" "$tmp_dir/intel.zip"

          sha_arm="$(shasum -a 256 "$tmp_dir/arm.zip" | awk '{print $1}')"
          sha_intel="$(shasum -a 256 "$tmp_dir/intel.zip" | awk '{print $1}')"

          cat > homebrew-jogger/Casks/jogger-macos.rb <<RUBY
          cask "jogger-macos" do
            version "${VERSION}"

            arch arm: "aarch64", intel: "x86_64"

            sha256 arm: "${sha_arm}"
            sha256 intel: "${sha_intel}"

            url "https://github.com/${OWNER}/${REPO}/releases/download/v#{version}/jogger-macos-#{arch}-apple-darwin.zip"
            name "Jogger"
            desc "Simple Jira time logger"
            homepage "https://github.com/${OWNER}/${REPO}"

            app "Jogger.app"
          end
          RUBY

      - name: Commit and push tap changes
        run: |
          set -euo pipefail
          cd homebrew-jogger

          if git diff --quiet; then
            echo "No tap changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/jogger-macos.rb
          git commit -m "Update jogger-macos cask for ${GITHUB_REF_NAME}"
          git push origin HEAD:main
